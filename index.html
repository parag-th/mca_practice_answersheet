<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Answer Sheet Practice</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#EBEDF2; --surface:#FFFFFF; --ink:#1B2A4A; --ink-soft:#33456B;
    --gold:#C98A2C; --muted:#6B7280; --border:#D7DBE3; --danger:#B3432B;
    --sans:'IBM Plex Sans',system-ui,sans-serif; --mono:'IBM Plex Mono',monospace;
    box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  }
  *{box-sizing:border-box;}
  html{scroll-padding-top:env(safe-area-inset-top,0px);}
  body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:var(--sans);}
  .wrap{max-width:920px;margin:0 auto;padding:28px 20px 60px;}
  .crumb{font-family:var(--mono);font-size:12.5px;color:var(--muted);margin-bottom:6px;}
  .crumb a{color:var(--ink-soft);text-decoration:none;cursor:pointer;}
  .crumb a:hover{text-decoration:underline;}
  .kicker{font-family:var(--mono);font-size:13px;color:var(--gold);letter-spacing:.02em;}
  h1{font-size:26px;margin:6px 0 6px;font-weight:600;}
  .sub{color:var(--muted);margin:0 0 22px;max-width:60ch;line-height:1.5;font-size:14.5px;}

  button{font-family:var(--sans);font-size:14px;font-weight:500;padding:9px 16px;border-radius:7px;border:1px solid var(--ink);background:var(--ink);color:#fff;cursor:pointer;}
  button.secondary{background:transparent;color:var(--ink);}
  button.ghost{background:transparent;color:var(--muted);border-color:var(--border);padding:6px 10px;font-size:13px;}
  button.danger{background:transparent;color:var(--danger);border-color:var(--danger);padding:6px 10px;font-size:13px;}
  button:hover{opacity:.85;}
  button:focus-visible, input:focus-visible, textarea:focus-visible, .bubble:focus-within{outline:2px solid var(--ink);outline-offset:2px;}

  .cardgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px;margin-bottom:20px;}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:16px;cursor:pointer;transition:border-color .15s;}
  .card:hover{border-color:var(--ink-soft);}
  .card h3{margin:0 0 4px;font-size:16px;font-weight:600;}
  .card .meta{font-family:var(--mono);font-size:12px;color:var(--muted);}
  .card .cardactions{display:flex;gap:6px;margin-top:12px;}
  .addcard{border:1.5px dashed var(--border);background:transparent;display:flex;align-items:center;justify-content:center;color:var(--muted);font-weight:500;min-height:88px;}
  .addcard:hover{border-color:var(--ink-soft);color:var(--ink);}

  .inlineform{display:flex;gap:8px;margin-bottom:20px;flex-wrap:wrap;}
  .inlineform input[type=text]{flex:1;min-width:180px;padding:9px 12px;border:1px solid var(--border);border-radius:7px;font-family:var(--sans);font-size:14px;background:#FCFCFD;color:var(--ink);}

  .panel{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:20px;margin-bottom:24px;}
  .panel h2{font-size:15px;margin:0 0 12px;font-weight:600;}
  textarea{width:100%;min-height:110px;font-family:var(--mono);font-size:13.5px;padding:12px;border:1px solid var(--border);border-radius:8px;resize:vertical;background:#FCFCFD;color:var(--ink);}
  .row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:12px;}
  .filebtn{position:relative;overflow:hidden;}
  .filebtn input[type=file]{position:absolute;inset:0;opacity:0;cursor:pointer;}
  .fname{color:var(--muted);font-size:13px;}
  .example{margin-top:10px;font-size:12.5px;color:var(--muted);font-family:var(--mono);white-space:pre;line-height:1.5;background:#F5F6F8;border:1px dashed var(--border);border-radius:6px;padding:8px 10px;}

  .status{font-family:var(--mono);font-size:13px;color:var(--muted);margin:4px 0 18px;}
  .status strong{color:var(--ink);}
  .toolbar{display:flex;gap:10px;justify-content:flex-end;margin-bottom:14px;}

  .sheet{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;}
  .item{background:var(--surface);border:1px solid var(--border);border-radius:9px;padding:12px;display:flex;flex-direction:column;gap:8px;align-items:center;}
  .num{font-family:var(--mono);font-weight:600;font-size:13px;color:var(--ink-soft);}
  .bubble{width:100%;display:flex;align-items:center;justify-content:center;gap:8px;padding:10px 6px;border:1.5px solid var(--border);border-radius:7px;background:#FCFCFD;cursor:pointer;user-select:none;transition:border-color .15s, background .15s;}
  .bubble input{appearance:none;width:16px;height:16px;border:1.5px solid var(--muted);border-radius:50%;margin:0;cursor:pointer;flex:none;}
  .bubble input:checked{border-color:var(--gold);background:radial-gradient(var(--gold) 45%, transparent 50%);}
  .bubble.revealed{border-color:var(--gold);background:#FBF3E7;}
  .answer{font-family:var(--mono);font-weight:700;font-size:15px;color:var(--gold);}
  .answer.hidden-text{color:var(--muted);font-weight:500;font-size:12.5px;}

  .empty{text-align:center;color:var(--muted);padding:40px 20px;font-size:14px;}
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#12151C; --surface:#1B2029; --ink:#EAECEF; --ink-soft:#C7CCD6;
      --border:#2C323E; --muted:#8B93A3; --gold:#E0A24A; --danger:#E2745A;
    }
    :root:not([data-theme="light"]) textarea, :root:not([data-theme="light"]) input[type=text]{background:#0F1218;color:#EAECEF;}
    :root:not([data-theme="light"]) .example{background:#171B23;}
    :root:not([data-theme="light"]) .bubble{background:#0F1218;}
    :root:not([data-theme="light"]) .bubble.revealed{background:#241D12;}
  }
  :root[data-theme="dark"]{
    --bg:#12151C; --surface:#1B2029; --ink:#EAECEF; --ink-soft:#C7CCD6;
    --border:#2C323E; --muted:#8B93A3; --gold:#E0A24A; --danger:#E2745A;
  }
</style>
</head>
<body>
<div class="wrap" id="wrap"></div>

<script>
(function(){
  const STORAGE_KEY = 'answerKeyApp_v1';
  let state = loadState();
  let nav = { subjectId: null, topicId: null };
  let showingAdder = null; // 'subject' | 'topic' | null

  function loadState(){
    try{
      const raw = localStorage.getItem(STORAGE_KEY);
      if(raw) return JSON.parse(raw);
    }catch(e){ console.error('Could not load saved data', e); }
    return { subjects: [] };
  }
  function saveState(){
    try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); localStorage.setItem(STORAGE_KEY + '_updatedAt', String(Date.now())); if(window.cloudSave) window.cloudSave(); }
    catch(e){ console.error('Could not save data', e); alert('Could not save — your browser storage may be full or blocked.'); }
  }
  function uid(){ return Math.random().toString(36).slice(2,10); }
  function esc(s){ return (s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

  function getSubject(id){ return state.subjects.find(s => s.id === id); }
  function getTopic(sub, id){ return sub.topics.find(t => t.id === id); }

  function parseAnswerKey(text){
    const pairs = [], seen = new Set();
    const re = /(\d{1,3})\s*[.):]\s*\(?\s*([a-eA-E])\s*\)?/g;
    let m;
    while((m = re.exec(text)) !== null){
      const num = parseInt(m[1], 10);
      if(seen.has(num)) continue;
      seen.add(num);
      pairs.push({ num, answer: m[2].toUpperCase() });
    }
    pairs.sort((a,b) => a.num - b.num);
    return pairs;
  }

  // ---------- Rendering ----------
  function render(){
    if(!nav.subjectId) return renderHome();
    const sub = getSubject(nav.subjectId);
    if(!sub){ nav.subjectId = null; return renderHome(); }
    if(!nav.topicId) return renderSubject(sub);
    const topic = getTopic(sub, nav.topicId);
    if(!topic){ nav.topicId = null; return renderSubject(sub); }
    return renderTopic(sub, topic);
  }

  function renderHome(){
    let html = '';
    html += '<div class="kicker">ANSWER SHEET PRACTICE</div>';
    html += '<h1>Your subjects</h1>';
    html += '<p class="sub">Organize answer keys by subject and topic. Everything is saved in this browser automatically.</p>';

    if(showingAdder === 'subject'){
      html += '<div class="inlineform"><input type="text" id="newSubjectInput" placeholder="Subject name, e.g. Physics">'
            + '<button onclick="app.addSubject()">Add</button>'
            + '<button class="secondary" onclick="app.cancelAdd()">Cancel</button></div>';
    }

    html += '<div class="cardgrid">';
    state.subjects.forEach(sub => {
      const topicCount = sub.topics.length;
      const qCount = sub.topics.reduce((n,t) => n + t.pairs.length, 0);
      html += '<div class="card" onclick="app.openSubject(\''+sub.id+'\')">'
            + '<h3>'+esc(sub.name)+'</h3>'
            + '<div class="meta">'+topicCount+' topic'+(topicCount===1?'':'s')+' · '+qCount+' question'+(qCount===1?'':'s')+'</div>'
            + '<div class="cardactions">'
            + '<button class="ghost" onclick="event.stopPropagation();app.renameSubject(\''+sub.id+'\')">Rename</button>'
            + '<button class="danger" onclick="event.stopPropagation();app.deleteSubject(\''+sub.id+'\')">Delete</button>'
            + '</div></div>';
    });
    if(showingAdder !== 'subject'){
      html += '<div class="card addcard" onclick="app.showAdder(\'subject\')">+ New subject</div>';
    }
    html += '</div>';

    if(state.subjects.length === 0 && showingAdder !== 'subject'){
      html += '<div class="empty">No subjects yet. Click "+ New subject" to start.</div>';
    }

    document.getElementById('wrap').innerHTML = html;
    if(showingAdder === 'subject'){
      const inp = document.getElementById('newSubjectInput');
      inp.focus();
      inp.addEventListener('keydown', e => { if(e.key === 'Enter') app.addSubject(); if(e.key === 'Escape') app.cancelAdd(); });
    }
  }

  function renderSubject(sub){
    let html = '';
    html += '<div class="crumb"><a onclick="app.goHome()">Home</a> / '+esc(sub.name)+'</div>';
    html += '<h1>'+esc(sub.name)+'</h1>';
    html += '<p class="sub">Topics inside this subject. Open a topic to load or practice its answer key.</p>';

    if(showingAdder === 'topic'){
      html += '<div class="inlineform"><input type="text" id="newTopicInput" placeholder="Topic name, e.g. Chapter 3">'
            + '<button onclick="app.addTopic()">Add</button>'
            + '<button class="secondary" onclick="app.cancelAdd()">Cancel</button></div>';
    }

    html += '<div class="cardgrid">';
    sub.topics.forEach(t => {
      html += '<div class="card" onclick="app.openTopic(\''+t.id+'\')">'
            + '<h3>'+esc(t.name)+'</h3>'
            + '<div class="meta">'+t.pairs.length+' question'+(t.pairs.length===1?'':'s')+'</div>'
            + '<div class="cardactions">'
            + '<button class="ghost" onclick="event.stopPropagation();app.renameTopic(\''+t.id+'\')">Rename</button>'
            + '<button class="danger" onclick="event.stopPropagation();app.deleteTopic(\''+t.id+'\')">Delete</button>'
            + '</div></div>';
    });
    if(showingAdder !== 'topic'){
      html += '<div class="card addcard" onclick="app.showAdder(\'topic\')">+ New topic</div>';
    }
    html += '</div>';

    if(sub.topics.length === 0 && showingAdder !== 'topic'){
      html += '<div class="empty">No topics yet. Click "+ New topic" to start.</div>';
    }

    document.getElementById('wrap').innerHTML = html;
    if(showingAdder === 'topic'){
      const inp = document.getElementById('newTopicInput');
      inp.focus();
      inp.addEventListener('keydown', e => { if(e.key === 'Enter') app.addTopic(); if(e.key === 'Escape') app.cancelAdd(); });
    }
  }

  function renderTopic(sub, topic){
    let html = '';
    html += '<div class="crumb"><a onclick="app.goHome()">Home</a> / <a onclick="app.goSubject()">'+esc(sub.name)+'</a> / '+esc(topic.name)+'</div>';
    html += '<h1>'+esc(topic.name)+'</h1>';
    html += '<p class="sub">Load a text file (or paste text) containing an answer key like <code>1. (c)</code>. Each question appears as a bubble — click it to reveal that answer.</p>';

    html += '<div class="panel">';
    html += '<h2>Load answer key</h2>';
    html += '<div class="row"><label class="filebtn"><button type="button" tabindex="-1">Choose .txt file</button><input id="fileInput" type="file" accept=".txt,text/plain"></label>'
          + '<span class="fname" id="fileName">No file chosen</span></div>';
    html += '<div class="row" style="margin-top:16px;"><textarea id="pasteBox" placeholder="...or paste answer key text here, e.g.\n1. (c)   2. (c)\n11. (d)  12. (d)\n21. (c)  22. (d)">'+esc(topic.rawText||'')+'</textarea></div>';
    html += '<div class="row"><button onclick="app.buildSheet()">Save &amp; build answer sheet</button>'
          + '<button class="secondary" type="button" onclick="app.clearTopicText()">Clear</button></div>';
    html += '<div class="example">Accepted formats: "1. (c)", "1) c", "1: (C)" — one or many per line, order doesn\'t matter.</div>';
    html += '</div>';

    html += '<div id="statusLine" class="status"></div>';
    html += '<div id="toolbar" class="toolbar" style="display:none;"><button class="secondary" onclick="app.revealAll()">Reveal all</button><button class="secondary" onclick="app.hideAll()">Hide all</button></div>';
    html += '<div id="sheet" class="sheet"></div>';

    document.getElementById('wrap').innerHTML = html;

    document.getElementById('fileInput').addEventListener('change', e => {
      const f = e.target.files[0];
      if(!f) return;
      document.getElementById('fileName').textContent = f.name;
      const reader = new FileReader();
      reader.onload = ev => { document.getElementById('pasteBox').value = ev.target.result; app.buildSheet(); };
      reader.onerror = () => { document.getElementById('statusLine').textContent = 'Could not read that file — try pasting the text instead.'; };
      reader.readAsText(f);
    });

    renderSheet(topic);
  }

  function renderSheet(topic){
    const statusLine = document.getElementById('statusLine');
    const toolbar = document.getElementById('toolbar');
    const sheet = document.getElementById('sheet');
    const pairs = topic.pairs || [];
    if(pairs.length === 0){
      sheet.innerHTML = '<div class="empty">No answer key loaded yet for this topic. Choose a file or paste text above.</div>';
      statusLine.textContent = '';
      toolbar.style.display = 'none';
      return;
    }
    statusLine.innerHTML = 'Loaded <strong>'+pairs.length+'</strong> question'+(pairs.length===1?'':'s')+'. Click a bubble to reveal its answer.';
    toolbar.style.display = 'flex';
    sheet.innerHTML = '';
    pairs.forEach(p => {
      const item = document.createElement('div');
      item.className = 'item';
      const num = document.createElement('div');
      num.className = 'num';
      num.textContent = 'Q' + p.num;
      const bubble = document.createElement('label');
      bubble.className = 'bubble';
      const cb = document.createElement('input');
      cb.type = 'checkbox';
      const ans = document.createElement('span');
      ans.className = 'answer hidden-text';
      ans.textContent = 'tap to reveal';
      cb.addEventListener('change', () => {
        if(cb.checked){ bubble.classList.add('revealed'); ans.classList.remove('hidden-text'); ans.textContent = p.answer; }
        else{ bubble.classList.remove('revealed'); ans.classList.add('hidden-text'); ans.textContent = 'tap to reveal'; }
      });
      bubble.appendChild(cb); bubble.appendChild(ans);
      item.appendChild(num); item.appendChild(bubble);
      sheet.appendChild(item);
    });
  }

  // ---------- Actions ----------
  window.app = {
    goHome(){ nav = {subjectId:null, topicId:null}; showingAdder=null; render(); },
    goSubject(){ nav.topicId = null; showingAdder=null; render(); },
    openSubject(id){ nav = {subjectId:id, topicId:null}; showingAdder=null; render(); },
    openTopic(id){ nav.topicId = id; render(); },

    showAdder(kind){ showingAdder = kind; render(); },
    cancelAdd(){ showingAdder = null; render(); },

    addSubject(){
      const inp = document.getElementById('newSubjectInput');
      const name = (inp.value || '').trim();
      if(!name) return;
      state.subjects.push({ id: uid(), name, topics: [] });
      saveState(); showingAdder = null; render();
    },
    renameSubject(id){
      const sub = getSubject(id);
      const name = prompt('Rename subject', sub.name);
      if(name && name.trim()){ sub.name = name.trim(); saveState(); render(); }
    },
    deleteSubject(id){
      const sub = getSubject(id);
      if(!confirm('Delete subject "'+sub.name+'" and all its topics and answer keys? This cannot be undone.')) return;
      state.subjects = state.subjects.filter(s => s.id !== id);
      saveState();
      if(nav.subjectId === id) nav = {subjectId:null, topicId:null};
      render();
    },

    addTopic(){
      const sub = getSubject(nav.subjectId);
      const inp = document.getElementById('newTopicInput');
      const name = (inp.value || '').trim();
      if(!name) return;
      sub.topics.push({ id: uid(), name, pairs: [], rawText: '' });
      saveState(); showingAdder = null; render();
    },
    renameTopic(id){
      const sub = getSubject(nav.subjectId);
      const t = getTopic(sub, id);
      const name = prompt('Rename topic', t.name);
      if(name && name.trim()){ t.name = name.trim(); saveState(); render(); }
    },
    deleteTopic(id){
      const sub = getSubject(nav.subjectId);
      const t = getTopic(sub, id);
      if(!confirm('Delete topic "'+t.name+'" and its saved answer key? This cannot be undone.')) return;
      sub.topics = sub.topics.filter(x => x.id !== id);
      saveState();
      if(nav.topicId === id) nav.topicId = null;
      render();
    },

    buildSheet(){
      const sub = getSubject(nav.subjectId);
      const topic = getTopic(sub, nav.topicId);
      const text = document.getElementById('pasteBox').value;
      topic.rawText = text;
      topic.pairs = parseAnswerKey(text);
      saveState();
      renderSheet(topic);
    },
    clearTopicText(){
      const sub = getSubject(nav.subjectId);
      const topic = getTopic(sub, nav.topicId);
      topic.rawText = '';
      topic.pairs = [];
      saveState();
      document.getElementById('pasteBox').value = '';
      document.getElementById('fileName').textContent = 'No file chosen';
      renderSheet(topic);
    },
    revealAll(){ document.querySelectorAll('#sheet input[type=checkbox]').forEach(cb => { if(!cb.checked){ cb.checked = true; cb.dispatchEvent(new Event('change')); } }); },
    hideAll(){ document.querySelectorAll('#sheet input[type=checkbox]').forEach(cb => { if(cb.checked){ cb.checked = false; cb.dispatchEvent(new Event('change')); } }); }
  };

  render();

  // Lets the Firebase sync code reload data after it arrives from the cloud.
  window.answerKeyApp = { reload: function(){ state = loadState(); render(); } };
})();
</script>

<!-- ===== Firebase cloud sync ===== -->
<div id="syncBox" style="position:fixed;right:12px;bottom:12px;z-index:50;display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:flex-end;max-width:92vw;font:12px/1.2 system-ui,sans-serif;color:#555;background:rgba(255,255,255,.95);border:1px solid rgba(0,0,0,.2);border-radius:10px;padding:8px 10px;box-shadow:0 2px 8px rgba(0,0,0,.15);">
  <span id="syncStatus">Cloud: connecting…</span>
  <button id="googleBtn" type="button" style="display:none;cursor:pointer;font:inherit;color:#222;background:#f1f1f1;border:1px solid rgba(0,0,0,.25);border-radius:6px;padding:4px 8px;">Sign in with Google</button>
  <button id="importBtn" type="button" style="cursor:pointer;font:inherit;color:#222;background:#f1f1f1;border:1px solid rgba(0,0,0,.25);border-radius:6px;padding:4px 8px;">Import backup</button>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
  import { getFirestore, doc, getDoc, setDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";
  import { getAuth, signInAnonymously, onAuthStateChanged, GoogleAuthProvider,
           linkWithPopup, signInWithCredential } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";

  const firebaseConfig = {
    apiKey: "AIzaSyAGNw6_KU4SqGcOtLznVVQ_h15KFgv2g7Y",
    authDomain: "mca-practice-answersheet.firebaseapp.com",
    projectId: "mca-practice-answersheet",
    storageBucket: "mca-practice-answersheet.firebasestorage.app",
    messagingSenderId: "779971320127",
    appId: "1:779971320127:web:204b7e96e30faaa7295b8a",
    measurementId: "G-ZW5KGSKZ0C"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);
  const auth = getAuth(app);

  // This app keeps everything in ONE localStorage entry: {subjects:[{id,name,topics:[{id,name,pairs,rawText}]}]}
  // Unlike scores, subjects/topics can be deleted, so we sync by "newest save wins"
  // (using a timestamp), not by keeping the best value.
  const DATA_KEY = "answerKeyApp_v1";
  const TS_KEY = DATA_KEY + "_updatedAt";

  const statusEl = document.getElementById("syncStatus");
  const googleBtn = document.getElementById("googleBtn");
  const importBtn = document.getElementById("importBtn");
  let currentUser = null;
  let ready = false; // true once the first cloud check has finished

  function readState() {
    try {
      const o = JSON.parse(localStorage.getItem(DATA_KEY) || "null");
      return o && Array.isArray(o.subjects) ? o : { subjects: [] };
    } catch (e) { return { subjects: [] }; }
  }
  function readTs() { return parseInt(localStorage.getItem(TS_KEY), 10) || 0; }
  function writeState(state, ts) {
    localStorage.setItem(DATA_KEY, JSON.stringify(state));
    localStorage.setItem(TS_KEY, String(ts));
  }

  // Combine two states without losing anything: subjects and topics are matched by id
  // (or by name for imported data); the copy with more questions wins a clash.
  function unionMerge(a, b) {
    const out = { subjects: [] };
    const subjects = new Map();
    function addSubject(sub) {
      const key = sub.id || sub.name;
      let target = subjects.get(key);
      if (!target) {
        target = { id: sub.id, name: sub.name, topics: [] };
        subjects.set(key, target);
        out.subjects.push(target);
      }
      (sub.topics || []).forEach(function (t) {
        const i = target.topics.findIndex(function (x) { return x.id === t.id; });
        if (i < 0) target.topics.push(t);
        else if ((t.pairs || []).length > (target.topics[i].pairs || []).length) target.topics[i] = t;
      });
    }
    (a.subjects || []).forEach(addSubject);
    (b.subjects || []).forEach(addSubject);
    return out;
  }

  // Short, readable reason for a failure (e.g. "permission-denied"), shown next to the status.
  function errInfo(e) {
    const code = e && e.code ? String(e.code).replace(/^(firestore|auth)\//, "") : "";
    return code || (e && e.message) || "unknown error";
  }
  function showError(label, e) {
    console.error(label, e);
    statusEl.textContent = "Cloud: " + label + " (" + errInfo(e) + ")";
    statusEl.title = (e && e.message) || "";
  }

  function refreshButtons() {
    googleBtn.style.display = currentUser && currentUser.isAnonymous ? "inline-block" : "none";
    statusEl.textContent = !currentUser ? "Cloud: offline"
      : currentUser.isAnonymous ? "Cloud: synced (this browser only)"
      : "Cloud: synced (" + (currentUser.email || "Google") + ")";
  }

  async function pushToCloud() {
    if (!currentUser || !ready) return;
    try {
      await setDoc(doc(db, "users", currentUser.uid), {
        data: JSON.stringify(readState()),
        updatedAtMs: readTs(),
        updatedAt: serverTimestamp()
      });
    } catch (e) { showError("save failed", e); }
  }

  // The app calls this after every save (debounced so we don't spam Firestore).
  let timer = null;
  window.cloudSave = function () { clearTimeout(timer); timer = setTimeout(pushToCloud, 500); };

  function reloadApp() { window.answerKeyApp && window.answerKeyApp.reload(); }

  async function syncDown(user) {
    ready = false;
    try {
      const snap = await getDoc(doc(db, "users", user.uid));
      const local = readState(), localTs = readTs();
      const localHasData = local.subjects.length > 0;

      if (!snap.exists()) {
        // Nothing in the cloud yet: upload what's on this device.
        if (localHasData && !localTs) localStorage.setItem(TS_KEY, String(Date.now()));
      } else {
        const remote = JSON.parse(snap.data().data || '{"subjects":[]}');
        const remoteTs = snap.data().updatedAtMs || 0;
        if (localHasData && !localTs) {
          // Old local data that was never synced: merge both so nothing is lost.
          writeState(unionMerge(local, remote), Date.now());
          reloadApp();
        } else if (remoteTs > localTs) {
          writeState(remote, remoteTs);   // cloud copy is newer
          reloadApp();
        }
        // else: this device is newer (or equal), so it gets pushed below
      }
      ready = true;
      await pushToCloud();
    } catch (e) {
      showError("sync failed", e);
      return;
    }
    refreshButtons();
  }

  // Firebase remembers a signed-in user (Google included) across page reloads and reports it here.
  // Only create an anonymous user when nobody is signed in. Calling signInAnonymously() on every load
  // would replace a restored Google session with a brand-new anonymous one.
  let triedAnonymous = false;
  onAuthStateChanged(auth, function (user) {
    currentUser = user;
    refreshButtons();
    if (user) { syncDown(user); return; }
    if (triedAnonymous) return;
    triedAnonymous = true;
    signInAnonymously(auth).catch(function (e) {
      console.error("Anonymous sign-in failed", e);
      statusEl.textContent = "Cloud: sign-in failed (see console)";
    });
  });

  // Upgrade the anonymous account to Google so your data follows you across devices.
  googleBtn.addEventListener("click", async function () {
    const provider = new GoogleAuthProvider();
    try {
      await linkWithPopup(auth.currentUser, provider);
      currentUser = auth.currentUser;
      refreshButtons();
    } catch (e) {
      if (e.code === "auth/credential-already-in-use") {
        await signInWithCredential(auth, GoogleAuthProvider.credentialFromError(e));
      } else {
        console.error(e);
        alert("Google sign-in failed: " + (e.code || e.message));
      }
    }
  });

  // Import the JSON copied from the old local file (a full localStorage dump works too).
  importBtn.addEventListener("click", function () {
    const text = prompt("Paste the JSON exported from your old localStorage:");
    if (!text) return;
    try {
      let old = JSON.parse(text);
      // localStorage dumps hold the app data as a string under "answerKeyApp_v1"
      if (old && old[DATA_KEY] !== undefined) old = old[DATA_KEY];
      if (typeof old === "string") old = JSON.parse(old);
      if (!old || !Array.isArray(old.subjects)) { alert("No answer-key data found in that JSON (looking for \"" + DATA_KEY + "\")."); return; }
      const merged = unionMerge(readState(), old);
      writeState(merged, Date.now());
      reloadApp();
      pushToCloud();
      const topics = merged.subjects.reduce(function (n, s) { return n + (s.topics || []).length; }, 0);
      alert("Imported! You now have " + merged.subjects.length + " subject(s) and " + topics + " topic(s).");
    } catch (e) {
      alert("That doesn't look like valid JSON. Copy the full console output and try again.");
    }
  });
</script>
</body>
</html>
